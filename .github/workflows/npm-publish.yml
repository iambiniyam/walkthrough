name: publish-npm
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  id-token: write
  contents: read
jobs:
  npm:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/walkthrough-render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
