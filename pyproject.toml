[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "walkthrough"
version = "0.1.0"
description = "Turn ordered screenshots into a step-by-step guide, locally."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Biniyam Gashaw" }]
keywords = ["documentation", "screenshots", "guide", "local-first", "vision"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Documentation",
]
dependencies = [
  "fastapi>=0.115",
  "pillow>=10.0",
  "python-multipart>=0.0.9",
  "rapidocr-onnxruntime>=1.3",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
model = ["mlx-vlm>=0.7.8"]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.6"]

[project.scripts]
walkthrough = "walkthrough.cli:app"

[project.urls]
Homepage = "https://github.com/iambiniyam/walkthrough"
Issues = "https://github.com/iambiniyam/walkthrough/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/walkthrough"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]
